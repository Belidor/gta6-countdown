<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>README: three ways</title>
<!-- 1280x520: watch face, glance and app. Rendered by render.sh. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="banner.css">
<style>
body { width: 1280px; height: 520px; }

.photo { object-position: 50% 55%; filter: blur(2px); transform: scale(1.03); }
.shade { background: linear-gradient(90deg, #3B1F4E 0%, #55386C 50%, #8E6DA8 100%); }
.dim { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(30, 16, 39, 0.45) 0, rgba(30, 16, 39, 0.15) 50%, rgba(30, 16, 39, 0.5) 100%); }

.head { left: 64px; right: 72px; top: 30px; display: flex; align-items: baseline; justify-content: space-between; }
.head h2 { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; text-shadow: 0 2px 20px rgba(30, 16, 39, 0.5); }
.head .eyebrow { color: var(--haze); }

.cards { left: 64px; right: 72px; top: 100px; bottom: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; }
.card { position: relative; display: flex; flex-direction: column; padding: 14px 22px 18px; }
.card .pic { position: relative; flex: 1; min-height: 0; margin-top: 30px; }
.card .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.card .tag { position: absolute; left: 16px; top: 16px; font-size: 15px; }
.card .num { position: absolute; right: 16px; top: 14px; font-size: 16px; font-weight: 700; color: var(--pink-deep); }
.card h3 { margin-top: 10px; font-size: 23px; line-height: 1.15; letter-spacing: -0.02em; }
.card p { margin-top: 4px; font-size: 18px; line-height: 1.4; color: #555; }
</style>
</head>
<body>
<img class="photo" src="../../../landing/img/game/vice-sunset-1920.jpg" alt="">
<div class="shade"></div>
<div class="dim"></div>

<div class="layer head">
    <h2>Three ways to watch the clock</h2>
    <p class="eyebrow">Use one or all three</p>
</div>

<div class="layer cards">
    <article class="card">
        <span class="num">01</span>
        <div class="pic"><img src="../../../landing/img/card-face.png" alt=""></div>
        <div>
            <span class="tag">WATCH FACE</span>
            <h3>Always in sight</h3>
            <p>Always-on mode on AMOLED.</p>
        </div>
    </article>
    <article class="card">
        <span class="num">02</span>
        <div class="pic"><img src="../../../landing/img/card-glance.png" alt=""></div>
        <div>
            <span class="tag">GLANCE</span>
            <h3>In the glance list</h3>
            <p>Keep your own watch face.</p>
        </div>
    </article>
    <article class="card">
        <span class="num">03</span>
        <div class="pic"><img src="../../../landing/img/card-app.png" alt=""></div>
        <div>
            <span class="tag">APP</span>
            <h3>Full screen + seconds</h3>
            <p>Open it with START.</p>
        </div>
    </article>
</div>
<p class="credit-line">Background: game footage © Rockstar Games / Take-Two Interactive</p>
</body>
</html>
