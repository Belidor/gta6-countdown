<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="card.css">
<style>
.frame { padding: 48px 56px 0; display: flex; flex-direction: column; }
h1 { font-size: 64px; letter-spacing: -2px; margin-top: 14px; }
.row { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 18px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
.col img { height: 560px; }
.col .tag { margin-top: -6px; }
</style></head><body>
<div class="frame">
  <p class="eyebrow">Pick one or use all three</p>
  <h1>Three ways to watch the clock</h1>
  <div class="row">
    <div class="col"><img src="../landing/img/card-face.png" alt=""><span class="tag">WATCH FACE</span></div>
    <div class="col"><img src="../landing/img/card-glance.png" alt=""><span class="tag">GLANCE</span></div>
    <div class="col"><img src="../landing/img/card-app.png" alt=""><span class="tag">APP</span></div>
  </div>
</div>
</body></html>
