<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="card.css">
<style>
html, body { width: 1200px; height: 630px; }
.frame { inset: 24px; box-shadow: 9px 9px 0 var(--fg); display: grid; grid-template-columns: 1fr 380px; align-items: center; padding-left: 48px; }
.left { display: flex; flex-direction: column; gap: 24px; }
h1 { font-size: 66px; letter-spacing: -2px; }
.eyebrow { font-size: 17px; }
.tags .tag { font-size: 17px; }
.right { height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.right img { height: 540px; }
</style></head><body>
<div class="frame">
  <div class="left">
    <p class="eyebrow">Garmin Connect IQ · free · open source</p>
    <h1>GTA VI countdown<br>on your wrist</h1>
    <div class="tags"><span class="tag">WATCH FACE</span><span class="tag">GLANCE</span><span class="tag">APP</span></div>
  </div>
  <div class="right"><img src="../landing/img/watch-face.png" alt=""></div>
</div>
</body></html>
